<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc">
  <title id="title">LMS App Accurate Wireframe Map</title>
  <desc id="desc">Three route-level wireframes matching the implemented React app: Home dashboard, Courses catalog, and Management workspace.</desc>

  <rect width="1700" height="1180" fill="#f2f2f2"/>

  <style>
    .outer { fill: #ffffff; stroke: #171717; stroke-width: 2; }
    .box { fill: #ececec; stroke: #2c2c2c; stroke-width: 1.4; }
    .soft { fill: #f7f7f7; stroke: #444; stroke-width: 1.1; }
    .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
    .sub { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #1d1d1d; }
    .tiny { font-family: Arial, sans-serif; font-size: 11px; fill: #2b2b2b; }
  </style>

  <text x="36" y="42" class="title">LMS Frontend Wireframe (Matched to App.jsx + Components)</text>
